name: Database Deploy

on:
  push:
    branches: [main]
    paths:
      - "database-scripts/**"
      - ".github/workflows/database-deploy.yml"
  pull_request:
    paths:
      - "database-scripts/**"
      - ".github/workflows/database-deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List pending scripts without executing them"
        type: boolean
        default: false

concurrency:
  group: database-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate scripts on a fresh database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: warsi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d warsi_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/warsi_db
      DB_SCHEMA: mart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary==2.9.9 python-dotenv==1.0.0

      - name: Create schema
        run: psql "$DATABASE_URL" -c "CREATE SCHEMA mart;"

      - name: Apply all scripts
        run: python database-scripts/deploy.py migrate

      - name: Verify re-run applies nothing
        run: |
          python database-scripts/deploy.py migrate | tee rerun.log
          grep -q "No pending scripts" rerun.log

      - name: Status
        run: python database-scripts/deploy.py status

  deploy:
    name: Deploy to warsi_db
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SCHEMA: mart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary==2.9.9 python-dotenv==1.0.0

      - name: Status before deploy
        run: python database-scripts/deploy.py status

      - name: Apply pending scripts
        run: python database-scripts/deploy.py migrate ${{ inputs.dry_run && '--dry-run' || '' }}
